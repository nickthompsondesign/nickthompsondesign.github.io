<style>
  :root {
    --font-heading: 'Fraunces', serif;
    --font-body: 'Outfit', sans-serif;
    --ink: #ffffff;
    --muted: rgba(255,255,255,0.62);
    --line: rgba(167,139,250,0.22);
    --panel: rgba(255,255,255,0.06);
    --panel-strong: rgba(255,255,255,0.1);
    --field: rgba(1,4,45,0.7);
    --lav: #a78bfa;
    --lav-light: #c4b5fd;
    --grad: linear-gradient(135deg, #5b3fc0 0%, #8a3fd0 55%, #c2187c 100%);
    --red: #ff7aa8;
    --black: #e6e3ff;
    --ok: #7ee0a8;
    --warn: #ffb86b;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --tracking-tight: -0.03em;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--ink);
    min-height: 100vh;
    background: #000113;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 12% -8%, rgba(0,20,255,0.55), transparent 45%),
      radial-gradient(circle at 96% 6%, rgba(220,38,170,0.32), transparent 40%),
      radial-gradient(circle at 50% 112%, rgba(50,0,255,0.42), transparent 52%),
      radial-gradient(circle at center, #01042d 0%, #000113 100%);
  }
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

  /* Site header */
  .site-top { max-width: 520px; margin: 0 auto; padding: 18px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .site-logo { font-family: var(--font-heading); font-weight: 800; font-size: 17px; color: #fff; text-decoration: none; letter-spacing: var(--tracking-tight); }
  .site-logo span { font-style: italic; font-weight: 200; opacity: 0.9; margin-left: 2px; }
  .site-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; text-decoration: none; }
  .site-back:hover { color: #fff; }
  .site-back svg { width: 13px; height: 13px; }
  .app-head { max-width: 520px; margin: 0 auto; padding: 22px 16px 4px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; background: linear-gradient(90deg, #a78bfa 0%, #d38cf5 55%, #ff7ac6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 1.5px; transform: rotate(45deg); background: linear-gradient(135deg, #a78bfa, #ff7ac6); }
  .app-title { font-family: var(--font-heading); font-weight: 600; font-size: 38px; line-height: 1.05; letter-spacing: var(--tracking-tight); margin: 8px 0 0; }

  /* Shared button styles */
  .btn-grad, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 100px; font-family: var(--font-heading); font-weight: 400; font-size: 15px; letter-spacing: var(--tracking-tight); cursor: pointer; transition: transform .3s var(--ease), background .3s, border-color .3s, box-shadow .3s; }
  .btn-grad { background: var(--grad); color: #fff; border: 0; box-shadow: 0 8px 24px rgba(100,40,255,0.25); }
  .btn-grad:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(100,40,255,0.35); }
  .btn-ghost { background: transparent; color: rgba(255,255,255,0.85); border: 1.5px solid rgba(167,139,250,0.4); }
  .btn-ghost:hover { border-color: var(--lav); color: #fff; }
  button:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* Trumps tracker */
  .tt-app { max-width: 520px; margin: 0 auto; padding: 22px 16px 48px; }
  .tt-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .tt-iconbtn { background: var(--panel); border: 1px solid var(--line); color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; transition: border-color .3s, background .3s; }
  .tt-iconbtn:hover, .tt-iconbtn.on { border-color: var(--lav); background: var(--panel-strong); }
  .tt-iconbtn svg { width: 20px; height: 20px; }

  .tt-leaderboard { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .tt-chip { flex: 0 0 auto; background: var(--panel); border-radius: 100px; padding: 8px 16px 8px 8px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); }
  .tt-chip:first-child { border-color: rgba(167,139,250,0.6); background: rgba(91,63,192,0.25); }
  .tt-chip .rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); font-size: 12px; font-weight: 700; }
  .tt-chip .name { font-size: 14px; font-weight: 400; }
  .tt-chip .score { font-family: var(--font-heading); font-size: 18px; font-weight: 600; }

  .tt-round-card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .tt-navbtn { background: transparent; border: 1.5px solid rgba(167,139,250,0.35); color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; transition: border-color .3s, background .3s; }
  .tt-navbtn:hover:not(:disabled) { border-color: var(--lav); background: rgba(167,139,250,0.12); }
  .tt-navbtn svg { width: 18px; height: 18px; }
  .tt-navbtn:disabled { opacity: 0.25; cursor: default; }
  .tt-round-center { text-align: center; flex: 1; }
  .tt-round-num { font-family: var(--font-heading); font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: var(--tracking-tight); }
  .tt-round-suit { font-size: 28px; margin-top: 4px; }
  .tt-round-suit.red { color: var(--red); }
  .tt-round-suit.black { color: var(--black); }
  .tt-round-suit.gold { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: brightness(1.6); }
  .tt-round-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .tt-tricks-check { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .tt-tricks-check.ok { color: var(--ok); }
  .tt-tricks-check.off { color: var(--warn); }

  .tt-player-row { background: var(--panel); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); }
  .tt-player-name { background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 400; width: 76px; padding: 2px 0; border-bottom: 1px solid transparent; }
  .tt-player-name:focus { outline: none; border-bottom: 1px solid var(--lav); }
  .tt-fields { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
  .tt-field { display: flex; flex-direction: column; align-items: center; }
  .tt-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 4px; }
  .tt-field input { width: 48px; height: 40px; background: var(--field); border: 1px solid rgba(167,139,250,0.3); color: #fff; border-radius: 10px; text-align: center; font-size: 16px; }
  .tt-field input:focus { outline: none; border-color: var(--lav); box-shadow: 0 0 0 3px rgba(167,139,250,0.2); }
  .tt-roundscore { font-family: var(--font-heading); font-size: 20px; font-weight: 600; width: 46px; text-align: right; color: var(--lav-light); }
  .tt-roundscore button, .tt-roundscore input { background: none; border: none; color: inherit; font: inherit; padding: 0; cursor: pointer; width: 100%; text-align: right; }

  .tt-addplayer { width: 100%; background: transparent; border: 1.5px dashed rgba(167,139,250,0.4); color: var(--muted); border-radius: 16px; padding: 12px; font-size: 14px; margin: 4px 0 18px; cursor: pointer; transition: border-color .3s, color .3s; }
  .tt-addplayer:hover { border-color: var(--lav); color: #fff; }

  .tt-history-toggle { display: flex; margin: 0 auto; }

  .tt-history-wrap { overflow-x: auto; margin: 14px 0 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
  .tt-history-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .tt-history-table th, .tt-history-table td { padding: 9px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid rgba(167,139,250,0.12); }
  .tt-history-table th { color: var(--muted); font-weight: 700; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .tt-history-table tr.active { background: rgba(167,139,250,0.16); }
  .tt-history-table tbody tr { cursor: pointer; }

  .tt-settings { background: var(--panel); border-radius: 20px; padding: 18px; margin-bottom: 18px; border: 1px solid var(--line); }
  .tt-settings h3 { font-family: var(--font-heading); font-size: 17px; margin: 0 0 10px; font-weight: 600; }
  .tt-settings select { width: 100%; background: var(--field); color: #fff; border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; padding: 11px 12px; font-size: 14px; margin-bottom: 10px; }
  .tt-settings .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .tt-settings-player { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(167,139,250,0.12); }
  .tt-settings-player button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; }
  .tt-reset { width: 100%; margin-top: 14px; border-color: rgba(255,122,168,0.5) !important; color: var(--red) !important; }

  .tt-modal-overlay { position: fixed; inset: 0; background: rgba(0,1,19,0.8); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .tt-modal { background: #0a0c3a; border: 1px solid rgba(167,139,250,0.4); border-radius: 22px; padding: 24px; max-width: 360px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .tt-modal h3 { font-family: var(--font-heading); font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  .tt-modal p { font-size: 14px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
  .tt-modal label.tt-checkbox { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #fff; margin-bottom: 18px; cursor: pointer; line-height: 1.5; }
  .tt-modal label.tt-checkbox input { margin-top: 3px; accent-color: #8a3fd0; }
  .tt-modal-actions { display: flex; gap: 8px; }
  .tt-modal-actions button { flex: 1; }
</style>

<body>
<div class="site-top"><a href="/" class="site-logo">NickThompson<span>Design</span></a><a href="/" class="site-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Portfolio</a></div>
<div class="tt-app" id="app"></div>

<script>
const STORAGE_KEY = "trumps-tracker-state-v1";
const SUIT_CYCLE = [
  { symbol: "♥", name: "Hearts", css: "red" },
  { symbol: "♠", name: "Spades", css: "black" },
  { symbol: "♦", name: "Diamonds", css: "red" },
  { symbol: "♣", name: "Clubs", css: "black" },
  { symbol: "NT", name: "No Trumps", css: "gold" },
];
function suitForRound(round) {
  return state.trumpOrder[13 - round];
}
function defaultTrumpOrder() {
  return Array.from({ length: 13 }, (_, i) => SUIT_CYCLE[i % 5]);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function randomTrumpOrder() {
  // 3 blocks of {4 suits + 1 no-trump}, each block shuffled independently,
  // then trimmed to 13 rounds (the 3rd block only partly used).
  const blocks = [shuffle([...SUIT_CYCLE]), shuffle([...SUIT_CYCLE]), shuffle([...SUIT_CYCLE])];
  return blocks.flat().slice(0, 13);
}

let state = {
  players: [
    { id: "p1", name: "Nick" },
    { id: "p2", name: "Player 2" },
  ],
  scores: {},
  currentRound: 13,
  scoringRule: "standard10",
  trumpOrder: defaultTrumpOrder(),
  showSettings: false,
  showHistory: false,
  editingScore: null,
  showClearModal: false,
  randomiseOnClear: true,
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.players = data.players || state.players;
      state.scores = data.scores || {};
      state.currentRound = data.currentRound || 13;
      state.scoringRule = data.scoringRule || "standard10";
      state.trumpOrder = data.trumpOrder || defaultTrumpOrder();
    }
  } catch (e) { console.error("load failed", e); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      players: state.players, scores: state.scores,
      currentRound: state.currentRound, scoringRule: state.scoringRule,
      trumpOrder: state.trumpOrder,
    }));
  } catch (e) { console.error("save failed", e); }
}

function computeScore(cell) {
  if (!cell) return null;
  if (cell.manual !== undefined && cell.manual !== "") return Number(cell.manual);
  const { estimate, actual } = cell;
  if (estimate === undefined || estimate === "" || actual === undefined || actual === "") return null;
  const e = Number(estimate), a = Number(actual);
  const hit = e === a;
  if (state.scoringRule === "standard10") return hit ? 10 + a : a;
  if (state.scoringRule === "standard5") return hit ? 5 + a : 0;
  if (state.scoringRule === "tricksOnly") return a;
  return null;
}
function totalFor(playerId) {
  let total = 0;
  Object.keys(state.scores).forEach((r) => {
    const s = computeScore(state.scores[r][playerId]);
    if (s !== null) total += s;
  });
  return total;
}
function updateCell(round, playerId, field, value) {
  if (!state.scores[round]) state.scores[round] = {};
  if (!state.scores[round][playerId]) state.scores[round][playerId] = {};
  state.scores[round][playerId][field] = value;
  saveState();
}

function render() {
  const rounds = Array.from({ length: 13 }, (_, i) => 13 - i);
  const suit = suitForRound(state.currentRound);
  const ranked = [...state.players].sort((a, b) => totalFor(b.id) - totalFor(a.id));
  const tricksAccounted = state.players.reduce((sum, p) => {
    const a = state.scores[state.currentRound]?.[p.id]?.actual;
    return sum + (a === undefined || a === "" ? 0 : Number(a));
  }, 0);
  const tricksClass = tricksAccounted === 0 ? "" : tricksAccounted === state.currentRound ? "ok" : "off";

  let html = "";
  html += `<div class="tt-header">
    <div><span class="eyebrow">Card game · Scorekeeper</span><h1 class="app-title">Trumps</h1></div>
    <button class="tt-iconbtn${state.showSettings ? " on" : ""}" data-action="toggle-settings" aria-label="Settings" aria-expanded="${state.showSettings}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>`;

  html += `<div class="tt-leaderboard">`;
  ranked.forEach((p, i) => {
    html += `<div class="tt-chip"><span class="rank">${i + 1}</span><span class="name">${escapeHtml(p.name)}</span><span class="score">${totalFor(p.id)}</span></div>`;
  });
  html += `</div>`;

  if (state.showSettings) {
    html += `<div class="tt-settings">
      <h3>Scoring rule</h3>
      <select data-action="set-rule">
        <option value="standard10" ${state.scoringRule === "standard10" ? "selected" : ""}>Exact bid = +10 + actual tricks, miss = actual tricks</option>
        <option value="standard5" ${state.scoringRule === "standard5" ? "selected" : ""}>Exact bid = 5 + tricks, miss = 0</option>
        <option value="tricksOnly" ${state.scoringRule === "tricksOnly" ? "selected" : ""}>Tricks won only, no bonus</option>
      </select>
      <div class="hint">Tap any round score (the purple number) to type in your own value. It always overrides the formula.</div>
      <h3>Players</h3>`;
    state.players.forEach((p) => {
      html += `<div class="tt-settings-player"><span>${escapeHtml(p.name)}</span>${state.players.length > 2 ? `<button data-action="remove-player" data-id="${p.id}">✕</button>` : ""}</div>`;
    });
    html += `<button class="tt-reset btn-ghost" data-action="reset">Clear all rounds</button></div>`;
  }

  html += `<div class="tt-round-card">
    <button class="tt-navbtn" data-action="prev-round" aria-label="Previous round" ${state.currentRound >= 13 ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="tt-round-center">
      <div class="tt-round-num">${state.currentRound}</div>
      <div class="tt-round-suit ${suit.css}">${suit.symbol}</div>
      <div class="tt-round-label">${suit.name} · Round ${14 - state.currentRound} of 13</div>
    </div>
    <button class="tt-navbtn" data-action="next-round" aria-label="Next round" ${state.currentRound <= 1 ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>`;

  html += `<div class="tt-tricks-check ${tricksClass}">Tricks played: ${tricksAccounted} / ${state.currentRound}</div>`;

  state.players.forEach((p) => {
    const cell = (state.scores[state.currentRound] && state.scores[state.currentRound][p.id]) || {};
    const roundScore = computeScore(cell);
    const isEditing = state.editingScore === p.id;
    html += `<div class="tt-player-row">
      <input class="tt-player-name" data-action="rename" data-id="${p.id}" value="${escapeHtml(p.name)}" />
      <div class="tt-fields">
        <div class="tt-field"><label>Est</label>
          <input type="number" inputmode="numeric" min="0" max="${state.currentRound}" data-action="cell" data-id="${p.id}" data-field="estimate" value="${cell.estimate ?? ""}" />
        </div>
        <div class="tt-field"><label>Actual</label>
          <input type="number" inputmode="numeric" min="0" max="${state.currentRound}" data-action="cell" data-id="${p.id}" data-field="actual" value="${cell.actual ?? ""}" />
        </div>
        <div class="tt-roundscore">
          ${isEditing
            ? `<input type="number" data-action="manual" data-id="${p.id}" value="${cell.manual ?? roundScore ?? ""}" autofocus />`
            : `<button data-action="edit-score" data-id="${p.id}">${roundScore !== null ? (roundScore > 0 ? "+" : "") + roundScore : "—"}</button>`}
        </div>
      </div>
    </div>`;
  });

  html += `<button class="tt-addplayer" data-action="add-player">+ Add player</button>`;
  html += `<button class="tt-history-toggle btn-ghost" data-action="toggle-history">${state.showHistory ? "Hide" : "Show"} full scoreboard</button>`;

  if (state.showHistory) {
    html += `<div class="tt-history-wrap"><table class="tt-history-table"><thead><tr><th>Rnd</th>`;
    state.players.forEach((p) => { html += `<th>${escapeHtml(p.name)}</th>`; });
    html += `</tr></thead><tbody>`;
    rounds.forEach((r) => {
      const s = suitForRound(r);
      const color = s.css === "red" ? "var(--red)" : s.css === "gold" ? "var(--lav-light)" : "var(--black)";
      html += `<tr class="${r === state.currentRound ? "active" : ""}" data-action="jump-round" data-round="${r}"><td><span style="color:${color}">${s.symbol}</span> ${r}</td>`;
      state.players.forEach((p) => {
        const c = state.scores[r] && state.scores[r][p.id];
        const sc = computeScore(c);
        html += `<td>${c?.estimate ?? "–"}/${c?.actual ?? "–"} ${sc !== null ? `(${sc})` : ""}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (state.showClearModal) {
    html += `<div class="tt-modal-overlay" data-action="modal-overlay">
      <div class="tt-modal">
        <h3>Start a new game?</h3>
        <p>This clears every player's estimate and actual score for all 13 rounds. This can't be undone.</p>
        <label class="tt-checkbox">
          <input type="checkbox" data-action="toggle-randomise" ${state.randomiseOnClear ? "checked" : ""} />
          <span>Randomise the trump order too — still suit, suit, suit, suit, no trump in each block of 5, just shuffled, so no trump can land anywhere within its block.</span>
        </label>
        <div class="tt-modal-actions">
          <button class="tt-modal-cancel btn-ghost" data-action="cancel-clear">Cancel</button>
          <button class="tt-modal-confirm btn-grad" data-action="confirm-clear">Clear rounds</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("app").innerHTML = html;
  attachHandlers();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function attachHandlers() {
  const app = document.getElementById("app");
  app.querySelectorAll('[data-action="toggle-settings"]').forEach(el => el.onclick = () => { state.showSettings = !state.showSettings; render(); });
  app.querySelectorAll('[data-action="toggle-history"]').forEach(el => el.onclick = () => { state.showHistory = !state.showHistory; render(); });
  app.querySelectorAll('[data-action="prev-round"]').forEach(el => el.onclick = () => { state.currentRound = Math.min(13, state.currentRound + 1); render(); });
  app.querySelectorAll('[data-action="next-round"]').forEach(el => el.onclick = () => { state.currentRound = Math.max(1, state.currentRound - 1); render(); });
  app.querySelectorAll('[data-action="add-player"]').forEach(el => el.onclick = () => {
    const id = "p" + Date.now();
    state.players.push({ id, name: "Player " + (state.players.length + 1) });
    saveState(); render();
  });
  app.querySelectorAll('[data-action="remove-player"]').forEach(el => el.onclick = () => {
    state.players = state.players.filter(p => p.id !== el.dataset.id);
    saveState(); render();
  });
  app.querySelectorAll('[data-action="reset"]').forEach(el => el.onclick = () => {
    state.showClearModal = true; render();
  });
  app.querySelectorAll('[data-action="cancel-clear"]').forEach(el => el.onclick = () => { state.showClearModal = false; render(); });
  app.querySelectorAll('[data-action="modal-overlay"]').forEach(el => el.onclick = (e) => { if (e.target === el) { state.showClearModal = false; render(); } });
  app.querySelectorAll('[data-action="toggle-randomise"]').forEach(el => el.onchange = (e) => { state.randomiseOnClear = e.target.checked; });
  app.querySelectorAll('[data-action="confirm-clear"]').forEach(el => el.onclick = () => {
    state.scores = {};
    state.currentRound = 13;
    if (state.randomiseOnClear) state.trumpOrder = randomTrumpOrder();
    state.showClearModal = false;
    saveState();
    render();
  });
  app.querySelectorAll('[data-action="set-rule"]').forEach(el => el.onchange = (e) => { state.scoringRule = e.target.value; saveState(); render(); });
  app.querySelectorAll('[data-action="jump-round"]').forEach(el => el.onclick = () => { state.currentRound = Number(el.dataset.round); render(); });
  app.querySelectorAll('[data-action="edit-score"]').forEach(el => el.onclick = () => { state.editingScore = el.dataset.id; render(); app.querySelector('[data-action="manual"]')?.focus(); });
  app.querySelectorAll('[data-action="manual"]').forEach(el => {
    el.onblur = (e) => { updateCell(state.currentRound, el.dataset.id, "manual", e.target.value); state.editingScore = null; render(); };
    el.onkeydown = (e) => { if (e.key === "Enter") e.target.blur(); };
  });
  app.querySelectorAll('[data-action="rename"]').forEach(el => {
    el.oninput = (e) => {
      const p = state.players.find(p => p.id === el.dataset.id);
      if (p) p.name = e.target.value;
      saveState();
    };
    el.onblur = () => render();
  });
  app.querySelectorAll('[data-action="cell"]').forEach(el => {
    el.oninput = (e) => { updateCell(state.currentRound, el.dataset.id, el.dataset.field, e.target.value); };
    el.onblur = () => render();
  });
}

loadState();
render();
</script>
</body>
</html>
