  <title>Page not found | Nick Thompson Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --brand: #4c3593;
      --brand-ink: #2e1e62;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      padding: 32px 24px;
      background: #f4f5f8;
      color: var(--brand-ink);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
    }
    .logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--brand-ink);
      text-decoration: none;
    }
    .logo span { font-style: italic; font-weight: 400; color: var(--brand); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .code {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
      margin: 0 0 12px;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0 0 16px;
    }
    p { font-size: 18px; line-height: 1.6; margin: 0 0 32px; max-width: 440px; }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 200ms ease, scale 160ms var(--ease-out);
    }
    .link:hover { background: var(--brand-ink); }
    .link:active { scale: 0.97; }
    .link:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  </style>
</head>

  <a href="/" class="logo">NickThompson<span>Design</span></a>

  <main>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/#portfolio" class="link">See all my work &rarr;</a>
  </main>
</body>
